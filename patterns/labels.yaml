# Hand-labelled chart patterns, used to build and test the pattern detectors.
# Prices and dates come from Yahoo Finance daily bars (unadjusted), checked
# against the annotated TradingView screenshots.

- id: v-2026-03-range-fakeout
  pattern: range_bull_fakeout
  symbol: NYSE:V          # TradingView
  ticker: V               # yfinance
  timeframe: 1D
  confirmation_timeframe: 4h
  range:
    start: 2025-01-10
    support: [299.00, 303.84]     # 2025-04-07 low, 2025-01-13 low
    resistance: [360.00, 375.51]  # 2025-06-11 high
  breakdown:
    first_close_below: 2026-03-27   # close 295.52
    lows: {2026-03-27: 294.32, 2026-04-01: 293.89}   # double bottom
    back_inside: 2026-03-30         # close 299.54
  confirmation:
    neckline: 303.34                # 2026-03-31 high, between the two lows
    higher_high_close: 2026-04-08   # close 308.96, also back above 303.84
  trade:
    entry: {date: 2026-04-08, price: 308.96}   # close above the neckline
    stop: 291.00                               # below the double bottom
    target: 360.00                             # first resistance of the range
    exit: {date: 2026-07-02, price: 360.00}    # high 362.13; stop never touched (min low 302.34)
  notes: >
    Long sideways range where fakeouts are common. Price closes below the range
    for a few days but cannot extend the move, retakes the range, and on 4h
    turns from lower highs/lows into a double bottom followed by higher highs
    and higher lows. Both conditions are required to treat the break as false.
    Exit: close everything at the top of the range for now; later, compare it
    with holding for a breakout of the range.

- id: eurusd-2024-12-range-fakeout
  pattern: range_bull_fakeout
  symbol: FX:EURUSD
  ticker: EURUSD=X
  timeframe: 1D
  range:
    start: 2023-01-06
    support: [1.0450, 1.0530]     # 2023-10-03 low, 2023-01-06 low area
    resistance: [1.1000, 1.1276]  # 2023-07-18 high
  breakdown:
    first_close_below: 2024-11-26
    closes_below: 42 of 64 days   # Dec 2024 to Feb 2025: a long, deep break
    lows: {2025-01-13: 1.0184, 2025-02-03: 1.0213}   # double bottom
    back_inside: 2025-02-14
  confirmation:
    neckline: 1.0534              # 2025-01-27 high, between the two lows
    higher_high_close: 2025-03-05 # close 1.0627
  trade:
    entry: {date: 2025-03-05, price: 1.0627}
    stop: 1.0150                  # assumed: below the double bottom (no line drawn)
    target: 1.1000
    exit: {date: 2025-04-03, price: 1.1000}   # stop never touched (min low 1.0603)
  notes: >
    Same pattern as Visa, but the break lasts about three months and goes about
    a third of the range height below support. Speed and depth of the recovery
    cannot be strict rules; the double bottom and the higher high are what
    matter. Valid pattern but not a trade to take: reward/risk below 1
    (4.5% risk for 3.5% to the target).
  take_trade: false

- id: nvda-2026-03-range-fakeout
  pattern: range_bull_fakeout
  reversal: inverse_head_and_shoulders
  symbol: NASDAQ:NVDA
  ticker: NVDA
  timeframe: 1D
  range:
    start: 2025-08-01
    support: rising trendline, about 170 to 178 by March 2026
    prior_low: 164.07             # 2025-09-05, still unbroken: confluence
    resistance: [210.00, 212.19]  # 2025-10-29 high
  breakdown:
    first_close_below: 2026-03-26  # close 171.24, below the trendline
    left_shoulder: {2026-03-20: 171.72}
    head: {2026-03-30: 164.27}     # 0.1% above the prior low, no close below it
    right_shoulder: {2026-04-07: 173.66}
  confirmation:
    neckline: [181.22, 177.79]     # 2026-03-25 high, 2026-04-06 high
    higher_high_close: 2026-04-08  # close 182.08
  trade:
    entry: {date: 2026-04-08, price: 182.08}
    stop: 163.00                   # assumed: below the head and the prior low
    target: 210.00
    exit: {date: 2026-04-24, price: 210.00}   # +15.3% for 10.5% risk
  notes: >
    The range floor is a rising trendline, not a horizontal level. Price
    breaks the trendline but stops exactly at the large September 2025 low,
    and turns with an inverse head and shoulders instead of a double bottom.

- id: amd-2026-02-range-fakeout
  pattern: range_bull_fakeout
  reversal: multiple_bottom
  symbol: NASDAQ:AMD
  ticker: AMD
  timeframe: 1D
  range:
    start: 2025-10-06
    support: [194.28, 200.00]     # 2025-11-25 low
    resistance: [264.00, 267.08]  # 2025-10-29 and 2026-01-23 highs
  breakdown:
    first_close_below: 2026-02-05  # close 192.50
    lows: {2026-02-05: 190.72, 2026-03-03: 188.22, 2026-03-09: 189.02,
           2026-03-13: 192.27, 2026-03-30: 192.87}   # rising lows after March 3
    back_inside: several times between February and April (a messy break)
  confirmation:
    neckline: 221.33               # 2026-03-25 high, highest high of the base
    higher_high_close: 2026-04-07  # close 221.53
  trade:
    entry: {date: 2026-04-07, price: 221.53}
    stop: 187.00                   # assumed: below the lowest low
    target: 264.00
    exit: {date: 2026-04-16, price: 264.00}   # +19.2% for 15.6% risk
  notes: >
    Not a clean fakeout: price loses the support and retakes it many times for
    two months, building a base with slowly rising lows instead of a clear
    double bottom. The trigger is the close above the top of that base.

- id: intc-2025-04-range-fakeout
  pattern: range_bull_fakeout
  reversal: bullish_engulfing
  symbol: NASDAQ:INTC
  ticker: INTC
  timeframe: 1D
  range:
    start: 2024-08-05
    support: [18.51, 18.78]       # 2024-09-10 low, 2025-02-03 low
    resistance: [26.00, 27.55]    # 2025-02-18 high
  breakdown:
    first_close_below: 2025-04-08  # close 18.13, the only close below the range
    low: {2025-04-08: 17.67}
  confirmation:
    candle: 2025-04-09             # open 18.07, close 21.53: engulfs the 2025-04-08 candle
  trade:
    entry: {date: 2025-04-09, price: 21.53}
    stop: 17.50                    # assumed: below the fakeout low
    target: 26.00
    exit: {date: 2025-08-19, price: 26.00}   # +20.8% for 18.7% risk
  notes: >
    One-day fakeout recovered by a single large bullish engulfing candle, with
    no double bottom. That day was a market-wide rally (US tariff pause), so
    the candle was not specific to Intel. After the entry price fell back to
    18.18 (2025-04-11), close to the stop, and took four months to reach the
    target.

- id: wm-2025-11-range-fakeout
  pattern: range_bull_fakeout
  reversal: inverse_head_and_shoulders
  symbol: NYSE:WM
  ticker: WM
  timeframe: 1D                  # screenshot was weekly (1W)
  range:
    start: 2024-03-01
    support: [196.59, 200.00]     # 2024-07-26 low
    resistance: [240.00, 242.58]  # 2025-06-03 high (later 248.13 on 2026-03-06)
  breakdown:
    first_close_below: none        # wick only: no daily close below 196.59
    left_shoulder: {2025-10-29: 197.02}
    head: {2025-11-03: 194.11}     # close 196.77, back above the support
    right_shoulder: {2025-11-10: 197.47}
  confirmation:
    neckline: 202.30               # 2025-11-07 high
    higher_high_close: 2025-11-11  # close 203.27
  trade:
    entry: {date: 2025-11-11, price: 203.27}
    stop: 193.00                   # assumed: below the head
    target: 240.00
    exit: {date: 2026-02-27, price: 240.00}   # +18.1% for 5.1% risk; min low 201.02
  notes: >
    Shallow fakeout seen on the weekly chart: a single wick 1.3% below the
    support, with no daily close outside the range, and a small inverse head
    and shoulders on daily. Tight stop, so the best reward/risk of the set.

- id: gold-2022-09-range-fakeout
  pattern: range_bull_fakeout
  reversal: triple_bottom
  symbol: TVC:GOLD
  ticker: GC=F                    # continuous future, a few dollars above spot
  timeframe: 1D
  range:
    start: 2020-08-01
    support: [1673.3, 1676.5]     # 2021-03-08 and 2021-03-30 lows
    resistance: [2050.0, 2089.2]  # 2020-08-07 and 2022-03-08 highs
  breakdown:
    first_close_below: 2022-09-20
    lows: {2022-09-28: 1622.2, 2022-10-21: 1621.1, 2022-11-03: 1618.3}
  confirmation:
    neckline: 1738.7               # 2022-10-04 high, top of the base
    higher_high_close: 2022-11-10  # close 1753.7
  trade:
    entry: {date: 2022-11-10, price: 1753.7}
    stop: 1610.0                   # assumed: below the triple bottom
    target: 2050.0
    exit: {date: 2023-04-13, price: 2050.0}   # +16.9% for 8.2% risk; min low 1705.5
  notes: >
    Range of more than two years. Six weeks below the support with three
    almost equal lows, then a close above the top of the base.

# --- Counterexamples: the pattern triggers, but the break was real -------------

- id: btc-2022-05-failed-fakeout
  pattern: range_bull_fakeout
  outcome: failed
  reversal: multiple_bottom
  symbol: BITSTAMP:BTCUSD
  ticker: BTC-USD
  timeframe: 1D
  range:
    start: 2021-01-01
    support: [28723, 31000]       # 2021-01-04 and 2021-06-22 lows
    resistance: [64000, 68790]    # double top, 2021-04 and 2021-11-10
  breakdown:
    first_close_below: none        # wick only, like WM
    head: {2022-05-12: 26350}      # close 29048, back inside
    lows: {2022-05-18: 28720, 2022-05-27: 28327}   # higher lows after the head
  confirmation:
    neckline: 31308                # 2022-05-15 high
    higher_high_close: 2022-05-30  # close 31726
  trade:
    entry: {date: 2022-05-30, price: 31726}
    stop: 26000                    # assumed: below the head
    exit: {date: 2022-06-13, price: 26000}   # stopped out, -18.0%; low 17,600 days later
  context:
    close_vs_sma200: -25.9%        # winners were between -9.8% and +12.0%
    sma200_slope_60d: -11.4%
    structure: lower highs since the 2021-11 top (descending trendline), the
      range had turned into a downtrend before the support broke
  notes: >
    Same shape as the winners (wick below support, higher lows, close above the
    neckline), but it failed. Differences to test as filters: price far below
    a falling 200-day average, and lower highs inside the range before the
    break. Crypto-wide crash (Terra/LUNA in May, Celsius in June).

- id: ndx-2022-01-failed-fakeout
  pattern: range_bull_fakeout
  outcome: failed
  reversal: hammer_and_confirmation
  symbol: TVC:NDQ
  ticker: ^NDX
  timeframe: 1D
  range:
    start: 2021-11-01             # only about 2.5 months old
    support: [15509, 15560]       # 2021-12-20 and 2021-12-03 lows
    resistance: [16607, 16765]    # 2021-11-22 and 2021-12-28 highs (double top)
  breakdown:
    low: {2022-01-10: 15166}       # 2.2% below support, close 15614 back inside
  confirmation:
    candle: 2022-01-10             # long lower wick, closes near the high
    confirmation_candle: 2022-01-11   # close 15844
  trade:
    entry: {date: 2022-01-11, price: 15844}
    stop: 15100                    # assumed: below the fakeout low
    exit: {date: 2022-01-19, price: 15100}   # stopped out, -4.7%; 13725 on 2022-01-24
  context:
    close_vs_sma200: +6.1%         # inside the winners' band: the 200-day filter would not catch it
    sma200_slope_60d: +6.2%
    structure: short range right after a strong uptrend, double top at the highs
  notes: >
    Looked like a textbook candle fakeout (strong rejection candle plus a
    positive follow-through day) and turned into the 2022 bear market. Unlike
    Bitcoin it was above a rising 200-day average; what sets it apart from the
    winners is a young range (2.5 months) and a reversal of one or two candles
    with no base or higher low.

# --- Bear fakeouts (bull traps): break above the range, then short -------------

- id: eurusd-2026-01-range-bull-trap
  pattern: range_bear_fakeout
  reversal: double_top
  symbol: FX:EURUSD
  ticker: EURUSD=X
  timeframe: 1D
  range:
    start: 2025-06-15
    support: [1.1395, 1.1456]     # 2025-08-01 and 2025-06-23 lows
    resistance: [1.1830, 1.1873]  # 2025-07-01 and 2025-09-17 highs
  breakout:
    first_close_above: 2026-01-27  # close 1.1876
    high: {2026-01-28: 1.2024}     # 1.3% above resistance
    back_inside: 2026-02-02        # close 1.1849
    lower_high: {2026-02-10: 1.1928}
  confirmation:
    neckline: 1.1767               # 2026-02-06 low, between the two highs
    lower_low_close: 2026-03-02    # close 1.1759
  trade:
    entry: {date: 2026-03-02, price: 1.1759}   # short
    stop: 1.2050                   # assumed: above the fakeout high
    target: 1.1450
    exit: {date: 2026-03-13, price: 1.1450}   # +2.6% for 2.5% risk; max high 1.1796
  notes: >
    Mirror image of the bull fakeouts: four closes above the range, back inside
    within a week, then a lower high and a close below the low between the two
    highs. The month-long top leaves the stop far away, so reward/risk is only
    about 1.

- id: gold-2023-12-failed-bull-trap
  pattern: range_bear_fakeout
  outcome: failed
  reversal: rejection_candle
  symbol: TVC:GOLD
  ticker: GC=F
  timeframe: 1D
  range:
    start: 2020-08-01
    support: [1673.3, 1676.5]
    resistance: [2078.8, 2089.2]
  breakout:
    high: {2023-12-04: 2152.3}     # 3% above resistance, close 2042.2 back inside
    lower_high: {2023-12-28: about 2093}
  confirmation:
    candle: 2023-12-04             # long upper wick, closes back in the range
    neckline: 1987.9               # 2023-12-13 low; never closed below it (min close 1993.2)
  trade:
    entry: {date: 2023-12-04, price: 2042.2}   # short, only with the candle trigger
    stop: 2160.0                   # assumed: above the fakeout high
    exit: {date: 2024-03-06, price: 2160.0}    # stopped out, -5.8%; 2203 on 2024-03-08
  context:
    trend: rising 200-day average, gold in a long-term uptrend
  notes: >
    Counterexample for the candle trigger only. The rejection candle would have
    shorted it and been stopped out when gold broke the range in March 2024,
    but the structure trigger (close below the low between the two highs)
    never fired, so that version stays out.
